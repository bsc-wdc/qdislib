# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Qdislib"
dynamic = ["version", "dependencies"]
authors = [
  { name = "Workflows and Distributed Computing Group (WDC) - Barcelona Supercomputing Center (BSC)", email = "support-compss@bsc.es" },
]
maintainers = [
  { name = "Workflows and Distributed Computing Group (WDC) - Barcelona Supercomputing Center (BSC)", email = "support-compss@bsc.es" },
]
description = "The quantum distributed computing library on top of PyCOMPSs"
# url="https://Qdislib.bsc.es",
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["Quantum", "distributed computing", "PyCOMPSs", "COMPSs", "Qdislib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Unix",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: System :: Distributed Computing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Quantum SDK backends. At least one is required to run circuits; the library
# imports fine with none installed (e.g. for documentation builds).
# qibo>=0.3.5 fixes the numpy>=2.4 collapse_state crash (see requirements.txt)
# via https://github.com/qiboteam/qibo/pull/1871, which shipped in qibo 0.3.5
# on PyPI (2026-09-16). This pin therefore resolves normally and the git
# install CI used to do first is gone -- it had also started failing, because
# qibo renamed its default branch from master to main and the pinned
# `@master` no longer resolves. The old pin was `qibo>=0.1.12,<0.2.17` (0.2.17+ regressed
# collapse-measurement execution; 0.3.x rewrote the API) -- verified against
# qibo's post-fix dev branch that Qdislib's full test suite passes
# unmodified, so the 0.3.x API rewrite doesn't affect anything Qdislib
# actually uses (Circuit/gates/queue/result.samples()/set_backend all kept
# their old import paths and behavior), and the collapse-measurement
# regression doesn't reproduce. Not independently re-verified:
# circuit_cache.py's qibo+pyzx semantic-key path (needs pyzx+lmdb installed)
# and the qiskit-combined cutting paths.
qibo = ["qibo>=0.3.5"]
qiskit = [
  "qiskit>=1.1.0",
  "qiskit-addon-cutting>=0.10.0",
  "qiskit_aer>=0.15.1",
  "qiskit-ibm-runtime>=0.20.0",   # only needed for the IBM Quantum QPU path
]
cudaq = ["cudaq"]   # unpinned: the cudaq meta-package selects a CUDA/CPU variant per platform, and a hard pin can request an unpublished one
# PennyLane >=0.40 requires numpy>=2, so it was held at <0.40 only to keep
# numpy<2 coexisting with the old qibo pin in [all]. Verified installed
# alongside qibo (from git, see above) + numpy 2.5: `import Qdislib` and the
# full test suite pass with pennylane, qibo, and qiskit all present together.
pennylane = [
  "pennylane>=0.40",
]
iqm = ["qiskit-iqm"]   # IQM hardware backend (Qdislib.core.backend.iqm_backend)
# Semantic circuit cache (Qdislib.utils.circuit_cache): pyzx computes the
# ZX/Weisfeiler-Lehman key; lmdb is the persistent on-disk store. The BSC
# COMPSs PSCO/Redis store used under PyCOMPSs comes from the COMPSs runtime.
cache = ["pyzx", "lmdb"]
# QPU listener (Qdislib.utils.qpu_bridge.run_qpu_listener) — the quantum-cluster
# side. Deliberately NOT in `all`: qililab is only needed on the QPU host, and
# the classical/CI side imports Qdislib without it.
qpu = ["qililab"]
all = ["Qdislib[qibo,qiskit,cudaq,pennylane,cache]"]
ci = [
  "pycodestyle",
  "pydocstyle",
  "black",
  "flake8",
  "bandit",
  "pylint",
  "prospector",
  "pytest",
  "pytest-cov",   # the [all] extra was removed in pytest-cov 7.x
  "nbsphinx",
  "nbsphinx-link",
  "sphinx-material",
  "sphinx-mdinclude",
]
notebooks = ["jupyter"]
qchip = ["qiboconnection>=0.12.0"]
pycompss = ["pycompss", "qiboconnection>=0.12.0"]

[tool.setuptools.dynamic]
version = { attr = "Qdislib.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["Qdislib*"]
exclude = ["notebooks"]
namespaces = false      # to disable scanning PEP 420 namespaces (true by default)

[project.urls]
Homepage = "https://Qdislib.bsc.es"
Documentation = "https://Qdislib.readthedocs.io"
# Repository = "https://github.com/me/spam.git"
# Issues = "https://github.com/me/spam/issues"
# Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

# [project.scripts]
# Qdislib-cli = "Qdislib:main_cli"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.coverage.report]
# Current coverage is ~65% (qibo+qiskit, cudaq tests skipped). This is the
# regression floor to ratchet upward as more tests are added.
fail_under = 60

[tool.coverage.run]
branch = true
source = ["Qdislib"]
command_line = "-m unittest discover -s tests/"

[tool.bandit]
exclude_dirs = ["notebooks/", "scripts/"]
# tests = []
# skips = [
#     "B301",  # skips pickle
#     "B403",  # skips import_pickle
#     "B404",  # skips import_subprocess
#     "B603",  # skips subprocess_without_shell_equals_true
#     "B311",  # skips random
# ]

[tool.bandit.assert_used]
skips = ["*/test_*.py"] # skips assertions in unittest files
