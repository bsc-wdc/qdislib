# GitLab CI for Qdislib.
#
# The BSC runner (bscgrid05) is a SHELL executor (it ignores `image:`) on Debian
# 11 whose only Python is the system 3.9.2 -- with a broken venv (no ensurepip)
# and no module system / conda / >=3.10 interpreter. Qdislib needs >=3.10, so we
# provision one with uv: bootstrapped via the node's working system pip, uv
# downloads a standalone CPython and manages the virtualenv (no ensurepip, no
# sudo). Override the version with UV_PYTHON.
#
# PyCOMPSs is not installed for the unit tests: they run in the serial fallback (see
# Qdislib/utils/runtime.py), and tests/_fake_compss.py checks what reaches a task goes
# through pickle. test:compss below runs real COMPSs, in a container. The quantum SDKs
# are optional extras.

stages:
  - lint
  - test

variables:
  UV_PYTHON: "3.12"                                # the >=3.10 interpreter uv provisions
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"      # for the one-off `pip3 install --user uv`

cache:
  paths:
    - .cache/uv
    - .cache/pip

# Every job runs in a uv-managed virtualenv on a provisioned CPython. before_script
# and script share one shell, so activating here makes `python`/`uv` apply to the
# job's own script below. uv is cached in $HOME between runs, so the bootstrap and
# python download only happen once per runner.
default:
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - command -v uv >/dev/null 2>&1 || pip3 install --user --upgrade uv
    - uv --version
    - uv python install "$UV_PYTHON"
    - uv venv --python "$UV_PYTHON" .venv-ci
    - . .venv-ci/bin/activate
    - python --version

# Wheels such as scikit-learn and qiskit-aer each bundle their own OpenMP runtime
# (<package>.libs/libgomp-<hash>.so). On this node's glibc (Debian 11, 2.31) such a
# library fails to load late in a process -- "cannot allocate memory in static TLS
# block" -- once other extensions have used up the static TLS reserve; the more
# SDKs a job installs, the sooner. Preloading every copy gives each its slot at
# startup. (GLIBC_TUNABLES=glibc.rtld.optional_static_tls would need glibc 2.32.)
# Run after the install step, so the libraries exist.
.preload_openmp:
  script:
    - export LD_PRELOAD="$(python -c 'import os, site; sp = site.getsitepackages()[0]; print(":".join(sorted(os.path.join(d, f) for d, _, fs in os.walk(sp) for f in fs if f.startswith("libgomp") and ".so" in f)))')"
    - echo "LD_PRELOAD=$LD_PRELOAD"

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - uv pip install black
    - black --check Qdislib/ tests/

# ---------------------------------------------------------------------------
# Tests (Qibo + Qiskit backends). The suite builds circuits with Qibo, so Qibo
# is always present; cudaq tests skip automatically when cudaq is absent.
# ---------------------------------------------------------------------------
test:
  stage: test
  script:
    - uv pip install ".[qibo,qiskit,cache,ci]"
    - !reference [.preload_openmp, script]
    - python -m unittest discover -s tests/ -v

# ---------------------------------------------------------------------------
# Coverage (Qibo + Qiskit). Enforces the fail_under floor set in pyproject.toml.
# ---------------------------------------------------------------------------
coverage:
  stage: test
  script:
    - uv pip install ".[qibo,qiskit,cache,ci]"
    - !reference [.preload_openmp, script]
    - coverage run -m unittest discover -s tests/
    - coverage report
    - coverage xml
  coverage: '/TOTAL.+?(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ---------------------------------------------------------------------------
# Optional-import hardening: the library must import with only ONE SDK present.
# ---------------------------------------------------------------------------
import-smoke:qibo:
  stage: test
  script:
    - uv pip install ".[qibo]"
    - python -c "import Qdislib; print('qibo-only import OK')"

import-smoke:qiskit:
  stage: test
  script:
    - uv pip install ".[qiskit]"
    - python -c "import Qdislib; print('qiskit-only import OK')"

import-smoke:pennylane:
  stage: test
  script:
    - uv pip install ".[pennylane]"
    - python -c "import Qdislib; print('pennylane-only import OK')"

import-smoke:cudaq:
  stage: test
  # The cudaq wheel may be unavailable on the node; don't block the pipeline.
  allow_failure: true
  script:
    - uv pip install ".[cudaq]"
    - python -c "import Qdislib; print('cudaq-only import OK')"

# ---------------------------------------------------------------------------
# Real COMPSs (runcompss, in the image of Dockerfile.compss): the example application,
# sampling and the engine's options, against the exact answers. Where the runner has
# no usable Docker this is a visible skip (exit 77), not a pass and not a failure;
# then scripts/mn5/check.sh is the check before a release. Not on every branch: the
# image takes a while to build.
# ---------------------------------------------------------------------------
test:compss:
  stage: test
  before_script: []
  allow_failure:
    exit_codes: 77
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|release-.*)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - docker info >/dev/null 2>&1 || { echo "SKIPPED - no usable Docker on this runner"; exit 77; }
    - docker build -f Dockerfile.compss -t "qdislib-compss:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm -e COMPSS_SKIP_SUITE=1 -e QDISLIB_SOFTWARE=qiskit "qdislib-compss:$CI_COMMIT_SHORT_SHA"

# ---------------------------------------------------------------------------
# CUDA-Q (CPU backend). The wheel may be unavailable on the node, so this job
# is allowed to fail without blocking the pipeline.
# ---------------------------------------------------------------------------
test:cudaq:
  stage: test
  allow_failure: true
  script:
    - uv pip install ".[all,ci]"
    - !reference [.preload_openmp, script]
    - python -m unittest discover -s tests/ -v
